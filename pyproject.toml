[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-auto-builder"
version = "1.0.0"
description = "Linux-first ROM modification pipeline with dependency-aware APK/JAR patching"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rom-builder = "rombuilder.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
