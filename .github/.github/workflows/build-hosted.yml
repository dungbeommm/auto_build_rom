name: Build hosted ROM
on:
  workflow_dispatch:
    inputs:
      rom_url: {description: 'HTTPS Fastboot ROM .tgz URL',required: true,type: string}
  issues: {types: [opened]}
  issue_comment: {types: [created]}
permissions: {contents: write,issues: write}
concurrency: {group: 'rom-${{ github.event.issue.number || github.run_id }}',cancel-in-progress: false}
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR') && contains(github.event.issue.body, '/mod-rom ')) ||
      ((github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR') && contains(github.event.comment.body, '/mod-rom '))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free disk before resizing
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune --all --force --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          df -h
      - uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Install minimal dependencies
        run: |
          # Disable large third-party indexes that are irrelevant to this build.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          sudo mkdir -p /var/lib/apt/lists/partial /var/cache/apt/archives/partial
          sudo apt-get \
            -o Acquire::Languages=none \
            -o Dir::Cache::pkgcache= \
            -o Dir::Cache::srcpkgcache= \
            update
          sudo apt-get install -y --no-install-recommends \
            erofs-utils e2fsprogs android-sdk-libsparse-utils fuse2fs attr jq
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          df -h
      - id: request
        env: {INPUT_ROM_URL: '${{ inputs.rom_url }}'}
        run: python3 scripts/extract_request.py
      - name: Build ROM
        env: {ROM_URL: '${{ steps.request.outputs.rom_url }}'}
        run: ./scripts/pipeline.sh
      - name: Split assets
        run: rom="$(find output -name '*_MODDED.tgz' -print -quit)"; ./scripts/split_release.sh "$rom" release
      - name: Release
        id: release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          tag="rom-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" release/* output/patch-report.json --title "$tag" --notes 'Hosted build; inspect patch-report.json before flashing.'
          echo "url=$(gh release view "$tag" --json url -q .url)" >> "$GITHUB_OUTPUT"
      - name: Reply
        if: github.event.issue.number
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body 'ROM: ${{ steps.release.outputs.url }}'
