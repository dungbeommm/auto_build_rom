name: Build ROM

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: "Stock ROM URL"
        required: true
        type: string
      port_url:
        description: "Port ROM URL"
        required: false
        type: string
      profile:
        description: "Profile JSON under config/profiles"
        required: true
        default: "config/profiles/default.json"
        type: string
      pack_type:
        description: "Output image package"
        required: true
        default: "super"
        type: choice
        options: [super, payload]
      fs_type:
        description: "Filesystem for rebuilt dynamic partitions"
        required: true
        default: "erofs"
        type: choice
        options: [erofs, ext4]
      device:
        description: "Optional target device code"
        required: false
        type: string

permissions:
  contents: read

env:
  TOOL_TREE_REF: V1.6.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 zip unzip p7zip-full xz-utils zstd lz4 rsync openssl
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install pinned Tool-Tree
        run: python scripts/install_tools.py

      - name: Run ROM pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m romauto.run \
            --config "${{ inputs.profile }}" \
            --stock "${{ inputs.stock_url }}" \
            --port "${{ inputs.port_url }}" \
            --pack-type "${{ inputs.pack_type }}" \
            --fs-type "${{ inputs.fs_type }}" \
            ${{ inputs.device != '' && format('--device "{0}"', inputs.device) || '' }}

      - name: Validate reports
        run: |
          test -f build/preflight-report.json
          test -f build/feature-report.json || true
          test -f build/diff-report.json
          find build -maxdepth 3 -type f -printf '%p %k KB\n' | sort | head -200

      - name: Package artifacts
        run: |
          mkdir -p release
          find out build -type f \( -name '*.img' -o -name '*.zip' -o -name 'payload.bin' \) -exec cp -v {} release/ \; || true
          cp build/preflight-report.json release/ || true
          cp build/feature-report.json release/ || true
          cp build/diff-report.json release/ || true
          sha256sum release/* > release/SHA256SUMS 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: rom-build
          path: release/
          if-no-files-found: error
          retention-days: 7
