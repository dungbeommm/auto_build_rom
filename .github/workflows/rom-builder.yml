name: ROM Auto Builder
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct ROM archive URL (.zip/.tgz/.tar.gz)'
        required: true
        type: string
      features:
        description: 'Comma-separated feature IDs'
        required: true
        default: 'reboot_menu'
        type: string
      strict:
        description: 'Fail when target/recipe is missing'
        required: true
        default: true
        type: boolean
      release:
        description: 'Create GitHub Release'
        required: true
        default: false
        type: boolean
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign android-sdk-build-tools android-sdk-libsparse-utils e2fsprogs erofs-utils curl unzip p7zip-full
      - name: Install Java archive tools
        run: |
          set -Eeuo pipefail
          mkdir -p bin/linux-x86_64
          curl -fL --retry 4 -o bin/linux-x86_64/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -fL --retry 4 -o bin/linux-x86_64/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat-release.jar
          curl -fL --retry 4 -o bin/linux-x86_64/smali.jar https://github.com/baksmali/smali/releases/download/3.0.9/smali-3.0.9-fat-release.jar
          test -s bin/linux-x86_64/apktool.jar
          test -s bin/linux-x86_64/baksmali.jar
          test -s bin/linux-x86_64/smali.jar
      - name: Install logical partition tools
        run: |
          set -Eeuo pipefail
          mkdir -p bin/linux-x86_64
          if [[ ! -x bin/linux-x86_64/lpunpack || ! -x bin/linux-x86_64/lpmake || ! -x bin/linux-x86_64/lpdump ]]; then
            rm -rf /tmp/lp-tools
            git clone --depth 1 --branch Linux-debian https://github.com/whyshhnuv/lpunpack-lpmake-mirror.git /tmp/lp-tools
            for n in lpunpack lpmake lpdump; do
              f="$(find /tmp/lp-tools -type f -name "$n" -perm -u+x | head -n1 || true)"
              [[ -n "$f" ]] || { echo "::error::$n not found"; exit 1; }
              install -m0755 "$f" "bin/linux-x86_64/$n"
            done
          fi
          sudo ln -sf "$PWD/bin/linux-x86_64/lpunpack" /usr/local/bin/lpunpack
          sudo ln -sf "$PWD/bin/linux-x86_64/lpmake" /usr/local/bin/lpmake
          sudo ln -sf "$PWD/bin/linux-x86_64/lpdump" /usr/local/bin/lpdump
          command -v simg2img; command -v fsck.erofs; command -v mkfs.erofs; command -v mke2fs
          lpunpack --help >/dev/null 2>&1 || true
          lpmake --help >/dev/null 2>&1 || true
      - name: Validate checkout
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          grep -q -- 'fsck.erofs' src/rombuilder/core/imagefs/manager.py
          ! grep -q -- 'dump.erofs.*str(out)' src/rombuilder/core/imagefs/manager.py
          python -m compileall -q src main.py
          bash ./scripts/run.sh doctor || true
      - name: Download ROM
        env: {ROM_URL_INPUT: '${{ inputs.rom_url }}'}
        run: |
          set -Eeuo pipefail
          mkdir -p workspace/input workspace/logs workspace/state
          ROM_URL="$(python3 - <<'PY'
          import os,re
          v=os.environ['ROM_URL_INPUT'].strip()
          m=re.fullmatch(r'\[([^]]+)\]\((https?://[^)]+)\)',v)
          if m: v=m.group(2)
          v=v.strip('<>')
          if not re.match(r'^https?://',v): raise SystemExit('Invalid URL')
          print(v)
          PY
          )"
          path="${ROM_URL%%\?*}"
          case "$path" in
            *.tgz|*.tar.gz) out=workspace/input/rom.tgz ;;
            *.zip) out=workspace/input/rom.zip ;;
            *) echo '::error::URL must end in .zip/.tgz/.tar.gz'; exit 2 ;;
          esac
          curl -fL --show-error --retry 5 --retry-delay 5 --retry-all-errors --continue-at - -o "$out" "$ROM_URL"
          test -s "$out"
          echo "ROM_SOURCE=$out" >> "$GITHUB_ENV"
      - name: Build ROM
        env: {FEATURES: '${{ inputs.features }}', STRICT: '${{ inputs.strict }}'}
        run: |
          set -Eeuo pipefail
          IFS=',' read -ra F <<< "$FEATURES"
          args=()
          for x in "${F[@]}"; do x="$(echo "$x" | xargs)"; [[ -n "$x" ]] && args+=(--feature "$x"); done
          if [[ "$ROM_SOURCE" == *.tgz ]]; then
            mkdir -p workspace/extracted
            tar -xzf "$ROM_SOURCE" -C workspace/extracted
            SRC=workspace/extracted
          else SRC="$ROM_SOURCE"; fi
          if [[ "$STRICT" == true ]]; then
            bash ./scripts/run.sh build "$SRC" "${args[@]}"
          else
            bash ./scripts/run.sh build "$SRC" --best-effort "${args[@]}"
          fi
      - name: Verify output
        run: |
          set -Eeuo pipefail
          test -s workspace/release/rom-modified.zip
          python - <<'PY'
          import zipfile
          p='workspace/release/rom-modified.zip'
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'Corrupt output member: {bad}')
          print('ROM ZIP integrity: OK')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rom-modified
          path: workspace/release/rom-modified.zip
      - name: Publish release
        if: inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="rom-${GITHUB_RUN_ID}"
          gh release create "$tag" workspace/release/rom-modified.zip --title "ROM build ${GITHUB_RUN_NUMBER}" --notes "Automated ROM build."
