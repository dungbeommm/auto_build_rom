name: ROM Auto Builder
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct ROM archive URL (.zip/.tgz/.tar.gz; optional)'
        required: false
        type: string
      features:
        description: 'Comma-separated feature IDs'
        required: true
        default: 'reboot_menu'
        type: string
      strict:
        description: 'Fail on missing target / missing exact recipe'
        required: true
        default: true
        type: boolean
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: System tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign android-sdk-build-tools android-sdk-libsparse-utils e2fsprogs erofs-utils
      - name: Fix script permissions
        run: chmod +x scripts/*.sh

      - name: Install logical partition tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bin/linux-x86_64

          # The repository intentionally does not carry large Linux binaries.
          # Fetch the pinned public precompiled LP tools when the checkout does
          # not already provide them.
          if [[ ! -x bin/linux-x86_64/lpunpack || ! -x bin/linux-x86_64/lpmake ]]; then
            rm -rf /tmp/lp-tools
            git clone --depth 1 --branch Linux-debian \
              https://github.com/whyshhnuv/lpunpack-lpmake-mirror.git \
              /tmp/lp-tools

            found_unpack="$(find /tmp/lp-tools -type f -name 'lpunpack' -perm -u+x | head -n 1 || true)"
            found_make="$(find /tmp/lp-tools -type f -name 'lpmake' -perm -u+x | head -n 1 || true)"

            [[ -n "$found_unpack" ]] || { echo '::error::lpunpack binary not found in LP tools archive'; exit 1; }
            [[ -n "$found_make" ]] || { echo '::error::lpmake binary not found in LP tools archive'; exit 1; }

            install -m 0755 "$found_unpack" bin/linux-x86_64/lpunpack
            install -m 0755 "$found_make" bin/linux-x86_64/lpmake
          fi

          ln -sf "$PWD/bin/linux-x86_64/lpunpack" /usr/local/bin/lpunpack
          ln -sf "$PWD/bin/linux-x86_64/lpmake" /usr/local/bin/lpmake

          command -v lpunpack
          command -v lpmake
          command -v simg2img
          command -v fsck.erofs
          lpunpack --help >/dev/null 2>&1 || true
          lpmake --help >/dev/null 2>&1 || true
          simg2img --help >/dev/null 2>&1 || true
          fsck.erofs --help | grep -q -- '--extract'

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p \
            workspace/input \
            workspace/extracted \
            workspace/super \
            workspace/partitions \
            workspace/logs \
            workspace/state

      - name: Download ROM
        if: inputs.rom_url != ''
        env:
          ROM_URL_INPUT: ${{ inputs.rom_url }}
        run: |
          set -Eeuo pipefail
          mkdir -p workspace/input workspace/extracted workspace/logs workspace/state

          # Accept a raw URL or Markdown pasted as [label](URL).
          ROM_URL="$(python3 -c 'import os,re,sys; v=os.environ["ROM_URL_INPUT"].strip(); m=re.fullmatch(r"\[([^]]+)\]\((https?://[^)]+)\)",v); v=m.group(2) if m else v; v=v.strip("<>"); sys.exit("Invalid ROM URL: "+v) if not re.match(r"^https?://",v) else print(v)')"

          URL_PATH="${ROM_URL%%\?*}"
          case "$URL_PATH" in
            *.tgz|*.tar.gz) OUT=workspace/input/rom.tgz ;;
            *.zip)         OUT=workspace/input/rom.zip ;;
            *)
              echo "::error::Unsupported ROM URL (expected .tgz, .tar.gz or .zip): $ROM_URL"
              exit 2
              ;;
          esac

          echo "Downloading: $ROM_URL"
          echo "Destination: $OUT"

          curl \
            --location \
            --fail \
            --show-error \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            --continue-at - \
            --output "$OUT" \
            "$ROM_URL"

          test -s "$OUT"
          echo "ROM_INPUT=$OUT" >> "$GITHUB_ENV"
          echo "Downloaded successfully:"
          ls -lh "$OUT"

      - name: Normalize downloaded archive
        if: inputs.rom_url != ''
        run: |
          set -Eeuo pipefail
          mkdir -p workspace/input workspace/extracted

          case "$ROM_INPUT" in
            *.tgz)
              tar -xzf "$ROM_INPUT" -C workspace/extracted
              ROM_SOURCE=workspace/extracted
              ;;
            *.zip)
              ROM_SOURCE="$ROM_INPUT"
              ;;
            *)
              echo "::error::Unsupported ROM archive: $ROM_INPUT"
              exit 1
              ;;
          esac

          echo "ROM_SOURCE=$ROM_SOURCE" >> "$GITHUB_ENV"

      - name: Run planner
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          IFS=',' read -ra F <<< "$FEATURES"
          args=()
          for x in "${F[@]}"; do args+=(--feature "$x"); done
          bash ./scripts/run.sh list-mods >/dev/null
          if [ "${ROM_SOURCE:-}" = "workspace/extracted" ]; then
            bash ./scripts/run.sh plan workspace/extracted "${args[@]}"
          else
            bash ./scripts/run.sh plan "${ROM_SOURCE:-workspace/input/rom.zip}" "${args[@]}"
          fi
      - name: Patch
        env:
          FEATURES: ${{ inputs.features }}
          STRICT: ${{ inputs.strict }}
        run: |
          IFS=',' read -ra F <<< "$FEATURES"
          args=()
          for x in "${F[@]}"; do args+=(--feature "$x"); done
          if [ "${ROM_SOURCE:-}" = "workspace/extracted" ]; then
            SRC=workspace/extracted
          else
            SRC="${ROM_SOURCE:-workspace/input/rom.zip}"
          fi
          if [ "$STRICT" = "true" ]; then bash ./scripts/run.sh patch "$SRC" "${args[@]}"; else bash ./scripts/run.sh patch "$SRC" --best-effort "${args[@]}"; fi
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: rom-builder-workspace
          path: workspace/
